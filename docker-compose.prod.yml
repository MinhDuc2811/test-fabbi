services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabbi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # Not reachable from the host in production - only over the compose network.
    ports: []

  redis:
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    # Not reachable from the host in production - only over the compose network.
    ports: []

  backend:
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://fabbi:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/postgres
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set, e.g. ["https://app.example.com"]}
      DB_ECHO: "false"

  frontend:
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set}
